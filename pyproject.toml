[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "priorauth-agent"
version = "1.0.0-local"
description = "Deterministic documentation readiness review for prior authorization paperwork. Human review only, never an approval, denial, or submission."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "streamlit>=1.35,<2", "PyMuPDF>=1.24,<2", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
